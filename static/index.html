<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>current_state browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Four independent mood blobs — animated by app.js -->
  <div class="blob" id="blob-a"></div>
  <div class="blob" id="blob-b"></div>
  <div class="blob" id="blob-c"></div>
  <div class="blob" id="blob-d"></div>

  <div class="card">

    <!-- Header -->
    <div class="card-header">
      <span class="site-name">current_state browser</span>
      <span class="site-tagline">Berlin · daily · since 09.01.2026</span>
    </div>

    <!-- Date picker -->
    <div class="picker-zone">
      <label class="picker-label" for="date-input">Select a date</label>
      <input type="date" id="date-input" />
      <span id="date-status"></span>
    </div>

    <!-- Entry: mood banner + summary -->
    <div class="mood-banner hidden" id="entry-section">
      <p class="entry-date" id="entry-date"></p>
      <p class="entry-summary" id="entry-summary"></p>
    </div>

    <!-- No entry state -->
    <div class="mood-banner mood-banner--empty hidden" id="no-entry-section">
      <p class="no-entry-text">No entry available for this date.</p>
    </div>

    <!-- Metadata -->
    <div class="meta-block hidden" id="meta-section">
      <div class="meta-row">
        <span class="meta-key">Themes</span>
        <span class="meta-val" id="entry-themes"></span>
      </div>
      <div class="meta-row meta-archetype">
        <span class="meta-key">current_state</span>
        <span class="meta-val" id="entry-archetype"></span>
      </div>
      <div class="meta-row">
        <span class="meta-key">Energy</span>
        <span class="meta-val" id="entry-energy"></span>
      </div>
      <div class="meta-row">
        <span class="meta-key">Affect</span>
        <span class="meta-val">
          <span class="meta-pair">
            <span class="meta-pair-item">
              <span class="meta-pair-sub">Tension</span>
              <span class="meta-pair-num" id="entry-tension"></span>
            </span>
            <span class="meta-pair-item">
              <span class="meta-pair-sub">Hope</span>
              <span class="meta-pair-num" id="entry-hope"></span>
            </span>
          </span>
        </span>
      </div>
    </div>

    <!-- Music prompt -->
    <div class="music-prompt hidden" id="music-section">
      <span class="music-prompt-label">Music</span>
      <p class="music-prompt-text"><em><span id="entry-prompt"></span></em></p>
    </div>

    <!-- Audio -->
    <div class="audio-zone">
      <p class="audio-status" id="audio-status"></p>
      <canvas id="waveform" width="600" height="36" class="hidden full-width"></canvas>
      <audio id="audio-player" controls class="hidden full-width" crossorigin="anonymous"></audio>
    </div>

    <!-- Footer -->
    <div class="card-footer">
      <p class="footer-text">
        Saurabh Datta &nbsp;·&nbsp; Berlin &nbsp;·&nbsp;
        &copy; <span id="footer-year"></span> — All rights reserved.
      </p>
    </div>

  </div><!-- /card -->

  <script src="/static/js/app.js"></script>
</body>
</html>
